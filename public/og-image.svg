<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050806" />
      <stop offset="50%" stop-color="#0b110d" />
      <stop offset="100%" stop-color="#040605" />
    </linearGradient>

    <!-- Radial Lime Glows -->
    <radialGradient id="glowTopRight" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#A0C60F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#A0C60F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#76B800" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#76B800" stop-opacity="0" />
    </radialGradient>

    <!-- Brand Lime Linear Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5E838" />
      <stop offset="100%" stop-color="#8DB205" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glowTopRight)" />
  <rect width="1200" height="630" fill="url(#glowBottomLeft)" />

  <!-- Subtle Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="rgba(160, 198, 15, 0.2)" stroke-width="1.5" />

  <!-- Top Navigation Pill -->
  <g transform="translate(80, 75)">
    <rect width="360" height="42" rx="21" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#A0C60F" />
    <text x="38" y="26" fill="#A0C60F" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">
      RAJKOT • SURAT • GUJARAT
    </text>
  </g>

  <!-- Eye Logo Emblem in Top Right -->
  <g transform="translate(980, 65)">
    <circle cx="60" cy="60" r="56" fill="rgba(160, 198, 15, 0.08)" stroke="rgba(160, 198, 15, 0.3)" stroke-width="1.5" />
    <!-- SVG Eye Logo -->
    <path d="M28 60 C38 42, 82 42, 92 60 C82 78, 38 78, 28 60 Z" fill="none" stroke="url(#limeGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="14" fill="url(#limeGrad)" />
    <circle cx="63" cy="57" r="4" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography Main Heading -->
  <text x="80" y="240" fill="#FFFFFF" font-family="'Space Grotesk', system-ui, sans-serif" font-size="82" font-weight="800" letter-spacing="-2">
    GREEN VISION
  </text>

  <!-- Subheading / Value Proposition -->
  <text x="80" y="320" fill="url(#limeGrad)" font-family="Georgia, serif" font-style="italic" font-size="44" font-weight="400">
    Where Vision Meets Impact.
  </text>

  <text x="80" y="375" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Premier Branding, Graphic Design &amp; 3D Advertising Studio
  </text>

  <!-- Core Competencies Tags -->
  <g transform="translate(80, 445)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(160,198,15,0.3)" stroke-width="1" />
      <text x="105" y="28" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
        Brand Identity Systems
      </text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(225, 0)">
      <rect width="230" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(160,198,15,0.3)" stroke-width="1" />
      <text x="115" y="28" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
        3D Mascot &amp; Renders
      </text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(470, 0)">
      <rect width="220" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(160,198,15,0.3)" stroke-width="1" />
      <text x="110" y="28" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
        Packaging Architecture
      </text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(705, 0)">
      <rect width="240" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(160,198,15,0.3)" stroke-width="1" />
      <text x="120" y="28" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
        Mega Outdoor Hoardings
      </text>
    </g>
  </g>

  <!-- Bottom Website Footer Link -->
  <g transform="translate(80, 545)">
    <text x="0" y="20" fill="#71717A" font-family="monospace" font-size="14" letter-spacing="1">
      OFFICIAL PORTFOLIO:
    </text>
    <text x="180" y="20" fill="#A0C60F" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1">
      https://greenvisionstudio.com
    </text>
  </g>

  <g transform="translate(1000, 545)">
    <text x="0" y="20" fill="#71717A" font-family="monospace" font-size="14" text-anchor="end" letter-spacing="1">
      EST. 2021
    </text>
  </g>
</svg>
